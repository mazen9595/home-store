const playPreset = (key, vol=0.15) => {
  const p = SOUND_PRESETS[key];
  if (!p || !p.pattern.length) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    p.pattern.forEach((freq, i) => {
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.14;
      g.gain.setValueAtTime(vol, start);
      g.gain.exponentialRampToValueAtTime(0.00001, start + p.dur);
      osc.start(start); osc.stop(start + p.dur + 0.05);
    });
  } catch(e){}
};

function ImageUploader({ value, onChange, label='اختر صورة', maxDimension=800, quality=0.75, maxOutputKB=500 }) {
  const fileRef = useRef(null); const [loading, setLoading] = useState(false); const [status, setStatus] = useState(''); const [error, setError] = useState('');
  const compressImage = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const originalSize = file.size; let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
          else { width = Math.round((width * maxDimension) / height); height = maxDimension; }
        }
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,width,height); ctx.drawImage(img,0,0,width,height);
        let q = quality; let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length/1024 > maxOutputKB && q > 0.3) { q -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', q); }
        let w2 = width, h2 = height, attempts = 0;
        while (dataUrl.length/1024 > maxOutputKB && attempts < 5) {
          w2 = Math.round(w2 * 0.8); h2 = Math.round(h2 * 0.8);
          canvas.width = w2; canvas.height = h2; ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w2,h2); ctx.drawImage(img,0,0,w2,h2);
          dataUrl = canvas.toDataURL('image/jpeg', q); attempts++;
        }
        resolve({ dataUrl, originalSize, newSize:dataUrl.length*0.75, compressionRatio:Math.round((1-(dataUrl.length*0.75)/originalSize)*100) });
      };
      img.onerror = () => reject(new Error('فشل تحميل الصورة'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('فشل قراءة الملف'));
    reader.readAsDataURL(file);
  });
  const handleFile = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setError(''); setStatus('');
    if (!file.type.startsWith('image/')) { setError('الملف ليس صورة'); return; }
    setLoading(true); setStatus('⏳ جارٍ ضغط الصورة...');
    try {
      const result = await compressImage(file);
      setStatus(`✅ تم الضغط — توفير ${result.compressionRatio}%`);
      onChange(result.dataUrl); setTimeout(()=>setStatus(''), 4000);
    } catch (err) { setError('فشل الضغط: ' + err.message); }
    finally { setLoading(false); if (fileRef.current) fileRef.current.value = ''; }
  };
  return (
    <div className="space-y-2">
      {value ? (
        <div className="relative w-full h-32 bg-white rounded-xl border border-slate-200 flex items-center justify-center overflow-hidden">
          <img src={value} alt="preview" className="max-w-full max-h-full object-contain p-2" />
          <button type="button" onClick={()=>{ onChange(''); setStatus(''); }} className="absolute top-1 left-1 bg-red-500 hover:bg-red-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center font-bold shadow-md">✕</button>
          <span className="absolute bottom-1 right-1 bg-slate-900/70 text-white text-[9px] px-2 py-0.5 rounded-full font-bold">{Math.round(value.length/1024)} KB</span>
        </div>
      ) : (<div className="w-full h-24 bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-xs">لا ملف</div>)}
      <input type="file" ref={fileRef} accept="image/*" onChange={handleFile} className="hidden" />
      <button type="button" onClick={()=>fileRef.current?.click()} disabled={loading} className={`w-full font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 ${loading?'bg-slate-200 text-slate-400':'bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200'}`}>
        {loading ? (<><span className="inline-block w-4 h-4 border-2 border-emerald-300 border-t-emerald-700 rounded-full spinner-ring"></span><span>جارٍ الضغط...</span></>) : (<>📷 {label}</>)}
      </button>
      {status && !loading && <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-[10px] p-2 rounded-lg text-center font-bold">{status}</div>}
      {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[10px] p-2 rounded-lg text-center font-bold">⚠️ {error}</div>}
    </div>
  );
}

              <button onClick={()=>setSoundsModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {broadcastModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">📢 إرسال إعلان</h3><button onClick={()=>setBroadcastModal(null)} className="text-slate-400 font-bold">✕</button></div>
            <form onSubmit={handleSendBroadcast} className="space-y-3">
              <input type="text" name="title" defaultValue={broadcastModal.title || ''} placeholder="العنوان (اختياري)" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
              <textarea name="message" required rows="4" placeholder="اكتب الإعلان..." className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
              <div className="bg-amber-50 border border-amber-200 text-amber-800 text-[10px] md:text-[11px] p-2.5 md:p-3 rounded-xl">💡 سيظهر لكل الأجهزة مع صوت + إشعار.</div>
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">📢 إرسال</button>
                <button type="button" onClick={()=>setBroadcastModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {pinChangeModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-sm w-full shadow-2xl space-y-3 md:space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">🔐 تغيير كلمة مرور الإدارة</h3><button onClick={()=>setPinChangeModal(null)} className="text-slate-400 font-bold">✕</button></div>
            <div className="space-y-2.5 md:space-y-3">
              <div>
                <label className="block text-[11px] md:text-xs font-bold mb-1 text-slate-700">كلمة المرور الحالية:</label>
                <input type="password" autoFocus value={pinChangeModal.current} onChange={e=>setPinChangeModal({ ...pinChangeModal, current:e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-base font-black text-center tracking-widest" placeholder="• • • •" maxLength={10} />
              </div>
              <div>
                <label className="block text-[11px] md:text-xs font-bold mb-1 text-slate-700">كلمة المرور الجديدة:</label>
                <input type="password" value={pinChangeModal.newPin} onChange={e=>setPinChangeModal({ ...pinChangeModal, newPin:e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-base font-black text-center tracking-widest" placeholder="• • • •" maxLength={10} />
              </div>
              <div>
                <label className="block text-[11px] md:text-xs font-bold mb-1 text-slate-700">تأكيد كلمة المرور:</label>
                <input type="password" value={pinChangeModal.confirm} onChange={e=>setPinChangeModal({ ...pinChangeModal, confirm:e.target.value })} onKeyDown={e=>{ if (e.key==='Enter') handleChangePin(); }} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-base font-black text-center tracking-widest" placeholder="• • • •" maxLength={10} />
              </div>
              {pinChangeModal.newPin && pinChangeModal.confirm && pinChangeModal.newPin !== pinChangeModal.confirm && (<div className="bg-red-50 border border-red-200 text-red-700 text-[10px] md:text-[11px] p-2 rounded-lg text-center font-bold">⚠️ كلمتا المرور غير متطابقتين</div>)}
              {pinChangeModal.newPin && pinChangeModal.newPin.length >= 4 && pinChangeModal.newPin === pinChangeModal.confirm && (<div className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-[10px] md:text-[11px] p-2 rounded-lg text-center font-bold">✅ جاهز للحفظ</div>)}
            </div>
            <div className="bg-amber-50 border border-amber-200 text-amber-800 text-[10px] p-2 md:p-2.5 rounded-xl text-center">⚠️ احفظ كلمة المرور الجديدة في مكان آمن</div>
            <div className="flex gap-2 pt-2 border-t border-slate-100">
              <button onClick={handleChangePin} disabled={!pinChangeModal.current || !pinChangeModal.newPin || pinChangeModal.newPin !== pinChangeModal.confirm} className={`flex-1 font-extrabold py-3 rounded-xl text-xs text-white ${!pinChangeModal.current || !pinChangeModal.newPin || pinChangeModal.newPin !== pinChangeModal.confirm ? 'bg-slate-300 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'}`}>🔐 حفظ PIN</button>
              <button onClick={()=>setPinChangeModal(null)} className="bg-slate-100 text-slate-700 font-bold px-4 py-3 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {themeModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">🎨 اللون</h3><button onClick={()=>setThemeModal(null)}>✕</button></div>
            <div className="grid grid-cols-3 gap-2 md:gap-3">
              {Object.entries(SITE_THEMES).map(([key, theme]) => (
                <button key={key} type="button" onClick={()=>{ playSound('click'); setThemeModal(key); }} className={`relative rounded-xl md:rounded-2xl h-16 md:h-20 transition border-2 ${themeModal===key?'border-slate-900 scale-105':'border-transparent'}`} style={{ background:`linear-gradient(to bottom right, ${theme.headerFrom}, ${theme.headerTo})` }}>
                  <span className="absolute bottom-1 left-0 right-0 text-white text-[9px] md:text-[10px] font-black text-center">{theme.label}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-2 pt-2">
              <button onClick={handleSaveTheme} className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
              <button onClick={()=>setThemeModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {logoModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">🏪 الشعار</h3><button onClick={()=>setLogoModal(null)}>✕</button></div>
            <div className="space-y-2.5 md:space-y-3">
              <input type="text" value={logoModal.emoji || ''} onChange={e=>setLogoModal({ ...logoModal, emoji:e.target.value })} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-2xl text-center" maxLength={2} />
              <div className="text-center text-[11px] md:text-xs text-slate-400">— أو —</div>
              <ImageUploader value={logoModal.dataUrl || ''} onChange={(val)=>setLogoModal({ ...logoModal, dataUrl:val })} label="اختر صورة" maxDimension={400} maxOutputKB={100} />
            </div>
            <div className="flex gap-2 pt-2">
              <button onClick={handleSaveLogo} className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
              <button onClick={()=>setLogoModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {categoriesModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">📂 الأقسام</h3><button onClick={()=>setCategoriesModal(null)}>✕</button></div>
            <div className="space-y-2">
              {categoriesModal.map((cat, i) => (
                <div key={i} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl">
                  <input type="text" value={cat.name} onChange={e=>{ const copy=[...categoriesModal]; copy[i]={ ...copy[i], name:e.target.value }; setCategoriesModal(copy); }} className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold min-w-0" />
                  <button onClick={()=>{ if (confirm(`حذف "${cat.name}"؟`)) setCategoriesModal(categoriesModal.filter((_,j)=>j!==i)); }} className="bg-red-100 text-red-700 px-3 py-2 rounded-lg text-xs font-bold shrink-0">🗑️</button>
                </div>
              ))}
            </div>
            <button onClick={()=>setCategoriesModal([...categoriesModal, { id:'cat_'+Date.now(), name:'قسم جديد' }])} className="w-full bg-slate-100 text-slate-700 font-extrabold py-2.5 rounded-xl text-xs">➕ إضافة قسم</button>
            <div className="flex gap-2 pt-2 border-t border-slate-100">
              <button onClick={handleSaveCategories} className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
              <button onClick={()=>setCategoriesModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {bannerModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">📢 البانر</h3><button onClick={()=>setBannerModal(null)}>✕</button></div>
            <form onSubmit={handleSaveBanner} className="space-y-3 md:space-y-4">
              <input type="text" name="kicker" defaultValue={bannerModal.kicker || ''} placeholder="kicker" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
              <input type="text" name="title" defaultValue={bannerModal.title || ''} placeholder="العنوان" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
              <textarea name="message" defaultValue={bannerModal.message || ''} rows="3" placeholder="الرسالة" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs" />
              <div className="grid grid-cols-4 gap-1.5 md:gap-2">
                {BANNER_THEMES.map(theme => (
                  <button key={theme.id} type="button" onClick={()=>setBannerModal({ ...bannerModal, themeId:theme.id })} className={`relative h-12 md:h-14 rounded-xl border-2 ${bannerModal.themeId===theme.id?'border-slate-900 scale-105':'border-transparent'}`} style={{ background:`linear-gradient(to bottom right, ${theme.bgFrom}, ${theme.bgTo})` }}>
                    <span className="text-[8px] md:text-[9px] font-black text-white">{theme.label}</span>
                  </button>
                ))}
              </div>
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
                <button type="button" onClick={()=>setBannerModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {productModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">{productModal.mode==='add'?'➕ منتج':'✏️ تعديل'}</h3><button onClick={()=>setProductModal(null)}>✕</button></div>
            <form onSubmit={handleSaveProduct} className="space-y-2.5 md:space-y-3">
              <input type="text" name="name" defaultValue={productModal.data?.name||''} required placeholder="الاسم" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
              <div className="grid grid-cols-2 gap-2">
                <select name="category" defaultValue={productModal.data?.category || allCategories[0]?.id || ''} className="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold min-w-0">
                  {allCategories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <input type="number" step="0.5" name="price" defaultValue={productModal.data?.price||0} required placeholder="السعر" className="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" />
              </div>
              <div className="grid grid-cols-3 gap-2">
                <input type="text" name="emoji" defaultValue={productModal.data?.emoji||'🛒'} className="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-center" maxLength={2} />
                <input type="text" name="desc" defaultValue={productModal.data?.desc||''} placeholder="وصف" className="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold col-span-2" />
              </div>
              <div>
                <label className="block text-[11px] md:text-xs font-bold mb-1 text-slate-700">📦 الكمية في المخزون:</label>
                <input type="number" step="1" min="0" name="stock" defaultValue={productModal.data?.stock ?? 10} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-black text-center" placeholder="0" />
              </div>
              <ImageUploader value={productModal.pendingImage || (productModal.data?.id ? imageMap[String(productModal.data.id)] : '') || ''} onChange={(val)=>setProductModal({ ...productModal, pendingImage:val })} label="اختر صورة المنتج" maxDimension={800} maxOutputKB={500} />
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
                <button type="button" onClick={()=>setProductModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {locationModalOpen && (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full shadow-2xl space-y-3 md:space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2 md:pb-3">
              <h3 className="font-black text-base md:text-lg">📍 وين أنت؟</h3>
              <button onClick={()=>{ setLocationModalOpen(false); setPendingPaymentMethod(null); setSelectedLocation(''); }}>✕</button>
            </div>
            <div className="grid grid-cols-2 gap-1.5 md:gap-2">
              {LOCATIONS.map(loc => (
                <button key={loc} onClick={()=>{ playSound('click'); setSelectedLocation(loc); }}
                  className={`p-2.5 md:p-3 rounded-xl text-[11px] md:text-xs font-bold border-2 ${selectedLocation===loc?'btn-brand border-transparent':'bg-slate-50 border-slate-200 text-slate-700'}`}>
                  {selectedLocation===loc ? '✓ ' : ''}{loc}
                </button>
              ))}
            </div>
            <div className="bg-slate-50 p-2.5 md:p-3 rounded-xl text-[11px] md:text-xs space-y-1">
              <div className="flex justify-between"><span>الطلب باسم:</span><strong className="text-brand">{myDisplayName}</strong></div>
              <div className="flex justify-between"><span>طريقة الدفع:</span><strong>{pendingPaymentMethod}</strong></div>
              <div className="flex justify-between"><span>الإجمالي:</span><strong className="text-brand">{cartTotal.toFixed(2)} ر.س</strong></div>
            </div>
            <div className="flex gap-2">
              <button onClick={confirmOrderWithLocation} disabled={!selectedLocation || isSubmitting} className={`flex-1 font-extrabold py-3 rounded-xl text-xs ${!selectedLocation || isSubmitting ? 'bg-slate-200 text-slate-400' : 'btn-brand'}`}>
                {isSubmitting ? '⏳ جارٍ الإرسال...' : '✅ تأكيد الطلب'}
              </button>
              <button onClick={()=>{ setLocationModalOpen(false); setPendingPaymentMethod(null); setSelectedLocation(''); }} className="bg-slate-100 text-slate-700 font-bold px-4 py-3 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {adminPinModalOpen && (
        <div className="fixed inset-0 bg-slate-950/70 z-[110] flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-sm w-full text-center space-y-3 md:space-y-4">
            <div className="text-3xl md:text-4xl">👑</div>
            <h3 className="font-black text-base md:text-lg">لوحة الإدارة 🔒</h3>
            <p className="text-[11px] md:text-xs text-slate-500">سيتم تذكّرك 30 يوم</p>
            <form onSubmit={(e)=>{ e.preventDefault(); if (pinInput===adminPin){ playSound('cash'); setIsAdminAuthenticated(true); setAdminPinModalOpen(false); setActiveTab('admin'); setPinInput(''); setPinError(''); try{ localStorage.setItem(LS_KEYS.DEVICE_USER, 'الدعم'); localStorage.setItem(LS_KEYS.ADMIN_TOKEN, JSON.stringify({createdAt:Date.now(), expiresAt:Date.now() + 30*24*60*60*1000})); setCurrentChatUser('الدعم'); }catch{} } else { playSound('click'); setPinError('كلمة المرور غير صحيحة!'); } }} className="space-y-3">
              <input type="password" value={pinInput} onChange={e=>{setPinInput(e.target.value);setPinError('');}} autoFocus className="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-center font-black" placeholder="الرمز" />
              {pinError && <p className="text-[11px] md:text-xs text-red-600 bg-red-50 p-2 rounded-lg">{pinError}</p>}
              <div className="flex gap-2">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">فتح</button>
                <button type="button" onClick={()=>setAdminPinModalOpen(false)} className="bg-slate-100 px-4 py-2.5 rounded-xl text-xs font-bold">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {payModalMember && (
        <div className="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-md w-full space-y-3 md:space-y-4">
            <div className="flex justify-between border-b pb-2 md:pb-3"><h3 className="font-black text-base md:text-lg">تسديد: {payModalMember.name}</h3><button onClick={()=>setPayModalMember(null)}>✕</button></div>
            <div className="bg-slate-50 p-3 rounded-xl md:rounded-2xl text-xs"><p>الدين:</p><p className="text-base md:text-lg font-black text-amber-600">{payModalMember.totalDebt.toFixed(2)} ر.س</p></div>
            <input type="number" value={payAmountInput} onChange={e=>setPayAmountInput(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold" />
            <div className="flex gap-2">
              <button onClick={handleSettleDebt} className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">تأكيد 💵</button>
              <button onClick={()=>setPayModalMember(null)} className="bg-slate-100 px-4 py-2.5 rounded-xl text-xs font-bold">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {notificationModal && (
        <div className="fixed inset-0 bg-slate-900/60 z-[130] flex items-center justify-center p-3 md:p-4">
          <div className="bg-white rounded-3xl p-5 md:p-6 max-w-sm w-full text-center space-y-3 md:space-y-4">
            <div className="text-3xl md:text-4xl">✅</div>
            <h3 className="font-black text-base md:text-lg">{notificationModal.title}</h3>
            <p className="text-[11px] md:text-xs text-slate-600">{notificationModal.message}</p>
            <button onClick={()=>setNotificationModal(null)} className="btn-brand w-full font-black py-2.5 rounded-xl text-xs">حسناً</button>
          </div>
        </div>
      )}

      <footer className="bg-slate-900 text-slate-400 text-center py-3 md:py-4 text-[10px] md:text-xs mt-4 md:mt-6">
        <div className="max-w-7xl mx-auto px-3 md:px-4 flex flex-wrap items-center justify-between gap-2">
          <span>بقالة أم محمد © 2026</span>
          <span className="bg-slate-800 text-slate-300 px-2 md:px-2.5 py-0.5 rounded-full text-[9px] md:text-[11px] font-bold">v{APP_VERSION}</span>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GroceryApp />);
</script>
</body>
</html>
