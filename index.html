<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالة أم محمد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات فايربيس للويب (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #FF7675;
            --primary-dark: #D63031;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
            --text-muted: #636E72;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: white;
            border-bottom: 1px solid #EDF2F7;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .store-title h1 {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
        }

        .store-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            background: #FFF5F5;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            font-size: 18px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #FF9F43 0%, #FF6B6B 100%);
            color: white;
            padding: 20px;
            margin: 15px;
            border-radius: var(--radius);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.25);
        }

        .welcome-banner h2 {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .welcome-banner p {
            font-size: 13px;
            opacity: 0.95;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: white;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
        }

        .drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid #EDF2F7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .drawer-footer {
            padding: 20px;
            border-top: 1px solid #EDF2F7;
            background: white;
        }

        .close-btn {
            background: #F1F2F6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .debt-card {
            background: #F8FAFC;
            border: 1px solid #EDF2F7;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-controls {
            background: #FFF9F9;
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }

        .admin-controls h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        .admin-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .admin-input-group select, .admin-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-secondary {
            background: #2D3436;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="store-title">
                <h1>بقالة أم محمد 🛒</h1>
                <p>قاعدة بيانات الديون السحابية الفورية</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleDebts()" title="قائمة الديون">
                    📒
                </button>
            </div>
        </header>

        <div class="welcome-banner">
            <h2>مرحباً بك يا مازن! 🚀</h2>
            <p>اضغط على أيقونة الدفتر 📒 بالأعلى لفتح قائمة الديون وتحديثها لتظهر مباشرة عند الجميع.</p>
        </div>
    </div>

    <!-- درج قائمة الديون -->
    <div class="drawer" id="debtsDrawer">
        <div class="drawer-header">
            <h2>قائمة الديون (أونلاين) 📒</h2>
            <button class="close-btn" onclick="toggleDebts()">✕</button>
        </div>
        
        <div class="drawer-body" id="debtsList">
            <!-- يتم تعبئتها تلقائياً من السحابة -->
        </div>

        <div class="drawer-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 700; font-size: 15px;">
                <span>إجمالي ديون البيت:</span>
                <span id="debtsTotal" style="color: var(--primary);">0 ريال</span>
            </div>

            <div class="admin-controls">
                <h3>🛠️ لوحة تعديل الديون وتسجيل السداد:</h3>
                <div class="admin-input-group">
                    <select id="adminMemberSelect">
                        <option value="بابا">بابا</option>
                        <option value="ماما">ماما</option>
                        <option value="مازن">مازن</option>
                        <option value="رتال">رتال</option>
                        <option value="مهاب">مهاب</option>
                    </select>
                    <input type="number" id="adminAmountInput" placeholder="المبلغ (ريال)" />
                </div>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-primary" style="padding: 10px; font-size: 12px; flex: 1;" onclick="applyPayment('subtract')">تسجيل سداد (-)</button>
                    <button class="btn-secondary" onclick="applyPayment('add')">إضافة دين (+)</button>
                    <button class="btn-secondary" style="background: #D63031;" onclick="zeroMember()">تصفير</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCiWQhkmQeGp3EOnJWvB4qx6L0bsJZAYPE",
            authDomain: "um-muhammad-store.firebaseapp.com",
            projectId: "um-muhammad-store",
            storageBucket: "um-muhammad-store.firebasestorage.app",
            messagingSenderId: "43485302301",
            appId: "1:43485302301:web:56d7865312986ebdc4c0f4",
            measurementId: "G-HJYQX7BNZG"
        };

        // تهيئة فايربيس
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const familyMembers = ['بابا', 'ماما', 'مازن', 'رتال', 'مهاب'];
        let debtsData = {};

        // جلب البيانات ومتابعتها لحظياً (Real-time listener)
        db.collection("storeData").doc("debts").onSnapshot((doc) => {
            if (doc.exists) {
                debtsData = doc.data();
            } else {
                // لو الوثيقة جديدة، ننشئها بقيم صفرية
                familyMembers.forEach(m => debtsData[m] = 0);
                db.collection("storeData").doc("debts").set(debtsData);
            }
            updateDebtsUI();
        }, (error) => {
            console.error("خطأ في جلب البيانات: ", error);
        });

        function toggleDebts() {
            document.getElementById('debtsDrawer').classList.toggle('active');
        }

        function updateDebtsUI() {
            const list = document.getElementById('debtsList');
            list.innerHTML = '';
            let totalHouseDebt = 0;

            familyMembers.forEach(member => {
                const amount = debtsData[member] || 0;
                totalHouseDebt += amount;
                list.innerHTML += `
                    <div class="debt-card">
                        <div><strong>👤 ${member}</strong></div>
                        <div><span style="font-weight: 900; color: ${amount > 0 ? 'var(--primary)' : 'var(--text-muted)'};">${amount} ريال</span></div>
                    </div>
                `;
            });

            document.getElementById('debtsTotal').innerText = totalHouseDebt + ' ريال';
        }

        function applyPayment(action) {
            const member = document.getElementById('adminMemberSelect').value;
            const amt = parseFloat(document.getElementById('adminAmountInput').value);

            if(isNaN(amt) || amt <= 0) {
                alert('الرجاء إدخال مبلغ صحيح!');
                return;
            }

            let currentVal = debtsData[member] || 0;
            if(action === 'subtract') {
                debtsData[member] = Math.max(0, currentVal - amt);
            } else if(action === 'add') {
                debtsData[member] = currentVal + amt;
            }

            // حفظ التحديث في فايربيس (يتحدث تلقائياً عند الكل)
            db.collection("storeData").doc("debts").set(debtsData).then(() => {
                document.getElementById('adminAmountInput').value = '';
                alert('تم التحديث وحفظه في السحابة بنجاح ✅');
            }).catch((error) => {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            });
        }

        function zeroMember() {
            const member = document.getElementById('adminMemberSelect').value;
            if(confirm(`هل متأكد من تصفير حساب ${member}؟`)) {
                debtsData[member] = 0;
                db.collection("storeData").doc("debts").set(debtsData).then(() => {
                    alert(`تم تصفير حساب ${member} ✅`);
                });
            }
        }
    </script>
</body>
</html>
