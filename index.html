const playSound = (type) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type==='click') { osc.frequency.value=600; gain.gain.setValueAtTime(0.05,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.1); osc.start(); osc.stop(ctx.currentTime+0.1); }
    else if (type==='cash') { osc.frequency.setValueAtTime(800,ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200,ctx.currentTime+0.15); gain.gain.setValueAtTime(0.1,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.25); osc.start(); osc.stop(ctx.currentTime+0.25); }
    else if (type==='message') { osc.frequency.setValueAtTime(520,ctx.currentTime); osc.frequency.setValueAtTime(780,ctx.currentTime+0.08); gain.gain.setValueAtTime(0.08,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.2); osc.start(); osc.stop(ctx.currentTime+0.2); }
  } catch(e) {}
};

/* ================== ImageUploader ================== */
function ImageUploader({ value, onChange, label = 'اختر صورة', maxSizeKB = 700 }) {
  const fileRef = useRef(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setError('');
    if (!file.type.startsWith('image/')) { setError('الملف ليس صورة'); return; }
    if (file.size > maxSizeKB * 1024) { setError(`حجم الصورة كبير (${Math.round(file.size/1024)}KB) - الحد ${maxSizeKB}KB`); return; }
    setLoading(true);
    const reader = new FileReader();
    reader.onload = (ev) => { onChange(ev.target.result); setLoading(false); };
    reader.onerror = () => { setError('فشل قراءة الملف'); setLoading(false); };
    reader.readAsDataURL(file);
  };
  return (
    <div className="space-y-2">
      {value ? (
        <div className="relative w-full h-32 bg-white rounded-xl border border-slate-200 flex items-center justify-center overflow-hidden">
          <img src={value} alt="preview" className="max-w-full max-h-full object-contain p-2" />
          <button type="button" onClick={() => onChange('')} className="absolute top-1 left-1 bg-red-500 hover:bg-red-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center font-bold">✕</button>
        </div>
      ) : (
        <div className="w-full h-24 bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-xs">لا صورة</div>
      )}
      <input type="file" ref={fileRef} accept="image/*" onChange={handleFile} className="hidden" />
      <button type="button" onClick={() => fileRef.current?.click()} disabled={loading}
        className={`w-full font-bold py-2.5 rounded-xl text-xs transition ${loading ? 'bg-slate-200 text-slate-400' : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200'}`}>
        {loading ? '⏳ جارٍ التحميل...' : '📷 ' + label}
      </button>
      {value && !loading && <p className="text-[10px] text-emerald-600 text-center">✅ {Math.round(value.length/1024)} KB</p>}
      {error && <p className="text-[10px] text-red-600 bg-red-50 p-2 rounded-lg text-center">{error}</p>}
    </div>
  );
}

    const { doc, setDoc } = window.FirebaseSDK;
    await setDoc(doc(dbInstance, COL.DATA, docId), data, { merge:true });
  };
  const addChatDoc = async (data) => {
    if (!dbInstance) throw new Error('غير متصل');
    const { addDoc, collection, serverTimestamp } = window.FirebaseSDK;
    await addDoc(collection(dbInstance, COL.CHAT), { ...data, timestamp: serverTimestamp() });
  };
  const addBotChatDoc = async (data) => { if (!botConfig.enabled) return; await addChatDoc(data); };
  const addOrderDoc = async (data) => {
    if (!dbInstance) throw new Error('غير متصل');
    const { addDoc, collection, serverTimestamp } = window.FirebaseSDK;
    const ref = await addDoc(collection(dbInstance, COL.ORDERS), { ...data, timestamp: serverTimestamp() });
    return ref.id;
  };
  const updateOrderDoc = async (docId, patch) => {
    if (!dbInstance) throw new Error('غير متصل');
    const { doc, updateDoc } = window.FirebaseSDK;
    await updateDoc(doc(dbInstance, COL.ORDERS, docId), patch);
  };
  const deleteChatDoc = async (docId) => {
    if (!dbInstance) throw new Error('غير متصل');
    const { doc, deleteDoc } = window.FirebaseSDK;
    await deleteDoc(doc(dbInstance, COL.CHAT, docId));
  };

  /* =============== الهوية =============== */
  const handleIdentityPick = (user) => {
    playSound('cash');
    if (user === 'الدعم') {
      setPinInput(''); setPinError('');
      setIdentityModalOpen(false);
      setSupportPinModalOpen(true);
    } else {
      setCurrentChatUser(user);
      setIdentityModalOpen(false);
    }
  };

  const handleVerifySupportPin = (e) => {
    e.preventDefault();
    if (pinInput === '3421') {
      playSound('cash');
      setCurrentChatUser('الدعم');
      setIsAdminAuthenticated(true);
      setSupportPinModalOpen(false);
      setActiveTab('admin');
      setPinInput(''); setPinError('');
    } else { playSound('click'); setPinError('كلمة المرور غير صحيحة!'); }
  };

  const handleCancelSupportPin = () => {
    playSound('click');
    setSupportPinModalOpen(false);
    setPinInput(''); setPinError('');
    setIdentityModalOpen(true);
  };

  /* =============== حالة المتجر =============== */
  const toggleStoreStatus = async () => {
    playSound('cash');
    try {
      await updateStoreDataDoc('storeStatus', { isOpen: !storeStatus.isOpen, updatedAt: Date.now() });
      setNotificationModal({ title: !storeStatus.isOpen?'🟢 فتح':'🔴 إغلاق', message: !storeStatus.isOpen?'المتجر مفتوح.':'المتجر مغلق.' });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const toggleBot = async () => {
    playSound('cash');
    try {
      await updateStoreDataDoc('botConfig', { enabled: !botConfig.enabled, updatedAt: Date.now() });
      setNotificationModal({
        title: botConfig.enabled ? '🔇 تم إطفاء البوت' : '🔊 تم تشغيل البوت',
        message: botConfig.enabled ? 'لن يرسل رسائل تلقائية.' : 'سيبدأ بإرسال الرسائل.'
      });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleSaveTheme = async () => {
    try {
      await updateStoreDataDoc('siteTheme', { themeId: themeModal, updatedAt: Date.now() });
      setThemeModal(null);
      setNotificationModal({ title:'🎨 تم', message:`الثيم: ${SITE_THEMES[themeModal].label}` });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleSaveBanner = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await updateStoreDataDoc('banner', {
        title: fd.get('title') || '', kicker: fd.get('kicker') || '', message: fd.get('message') || '',
        themeId: bannerModal.themeId || 'amber', updatedAt: Date.now(),
      });
      setBannerModal(null);
      setNotificationModal({ title:'✅ تم', message:'تم حفظ البانر.' });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleSaveCategories = async () => {
    try {
      await updateStoreDataDoc('categories', { list: categoriesModal });
      setCategoriesModal(null);
      setNotificationModal({ title:'✅ تم', message:`${categoriesModal.length} قسم.` });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleSaveLogo = async () => {
    try {
      await updateStoreDataDoc('storeLogo', { emoji: logoModal.emoji || '🛒', dataUrl: logoModal.dataUrl || '', updatedAt: Date.now() });
      setLogoModal(null);
      setNotificationModal({ title:'✅ تم', message:'تم حفظ الشعار.' });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleSaveProduct = async (e) => {
    e.preventDefault();
    if (!productModal || !dbInstance) return;
    playSound('cash');
    const fd = new FormData(e.target);
    const existingId = productModal.data?.id;
    let newId = existingId;
    if (!newId) {
      const nums = products.map(p => Number(p.id)||0);
      newId = (nums.length ? Math.max(...nums) : 0) + 1;
    }
    const newProduct = {
      id: newId, name: fd.get('name').trim(), price: parseFloat(fd.get('price')) || 0,
      desc: fd.get('desc')?.trim() || '', emoji: fd.get('emoji') || '🛒',
      category: fd.get('category') || '', imageUrl: '',
    };
    const newList = existingId ? products.map(p => String(p.id) === String(existingId) ? { ...p, ...newProduct } : p) : [...products, newProduct];
    try {
      await updateStoreDataDoc('products', { list: newList });
      if (productModal.pendingImage) {
        await updateStoreDataDoc('productImage_' + newId, { productId:newId, dataUrl: productModal.pendingImage, type:'productImage', updatedAt: new Date().toISOString() });
      }
      setProductModal(null);
      setNotificationModal({ title:'✅ تم', message:`حُفظ (${newProduct.name}).` });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleDeleteProduct = async (id, name) => {
    playSound('click');
    if (!confirm(`حذف (${name})؟`)) return;
    const newList = products.filter(p => String(p.id) !== String(id));
    try { await updateStoreDataDoc('products', { list: newList }); setNotificationModal({ title:'✅ حُذف', message:name }); }
    catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  /* ============================================================
     📌 v2.0.1 جديد: إدارة الديون للمشرف فقط
     (إضافة / خصم / تصفير)
     ============================================================ */
  const handleDebtAdjust = async () => {
    if (!debtModal) return;
    const { member, mode, amount } = debtModal;

    let newAmount;
    let actionMsg = '';

    if (mode === 'reset') {
      newAmount = 0;
      actionMsg = `🔄 صفّر المشرف دين (${member.name}).`;
    } else {
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) {
        setNotificationModal({ title:'⚠️', message:'أدخل مبلغاً صحيحاً أكبر من صفر' });
        return;
      }
      if (mode === 'add') {
        newAmount = (member.totalDebt || 0) + val;
        actionMsg = `➕ أضاف المشرف ${val.toFixed(2)} ر.س لحساب (${member.name}). الدين الآن: ${newAmount.toFixed(2)} ر.س`;
      } else if (mode === 'subtract') {
        newAmount = Math.max(0, (member.totalDebt || 0) - val);
        actionMsg = `➖ خصم المشرف ${val.toFixed(2)} ر.س من حساب (${member.name}). الدين الآن: ${newAmount.toFixed(2)} ر.س`;
      }
    }

    playSound('cash');
    const newDebts = { ...debtsMap };
    newDebts[member.name] = newAmount;

    try {
      await updateStoreDataDoc('debts', newDebts);
      await addBotChatDoc({
        sender: 'الدعم',
        text: actionMsg,
        timeString: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})
      });
      setDebtModal(null);
      setNotificationModal({ title:'✅ تم التعديل', message: actionMsg });
    } catch (err) {
      setNotificationModal({ title:'❌ فشل', message: err.message });
    }
  };

  /* ============================================================
     handleSettleDebt — يبقى موجوداً لكن يُستخدم فقط من الإدارة القديمة
     (لا يوجد زر عام في صفحة الديون للمستخدم العادي)
     ============================================================ */
  const handleSettleDebt = async () => {
    const amount = parseFloat(payAmountInput);
    if (!payModalMember || isNaN(amount) || amount <= 0) return;
    playSound('cash');
    const newDebts = { ...debtsMap };
    newDebts[payModalMember.name] = Math.max(0, (newDebts[payModalMember.name]||0) - amount);
    try {
      await updateStoreDataDoc('debts', newDebts);
      await addBotChatDoc({
        sender:'الدعم', text:`✅ تم تسديد ${amount.toFixed(2)} ر.س لحساب (${payModalMember.name}).`,
        timeString: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})
      });
      setPayModalMember(null); setPayAmountInput('');
      setNotificationModal({ title:'✅ تم', message:`خُصم ${amount.toFixed(2)} ر.س.` });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const handleSendChatMessage = async (e) => {
    e.preventDefault();
    const text = (e.target.chatInput?.value || '').trim();
    if (!text || !dbInstance) return;
    playSound('message');
    try {
      await addChatDoc({ sender:currentChatUser, text, timeString: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}) });
      e.target.chatInput.value = '';
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };
  const handleDeleteChatMessage = async (docId) => {
    playSound('click');
    try { await deleteChatDoc(docId); } catch(e){ console.warn(e); }
  };

  const addToCart = (product) => {
    playSound('click');
    setCart(prev => {
      const ex = prev.find(i => String(i.id)===String(product.id));
      if (ex) return prev.map(i => String(i.id)===String(product.id) ? { ...i, qty:i.qty+1 } : i);
      return [...prev, { ...product, qty:1 }];
    });
  };
  const updateCartQty = (id, delta) => {
    playSound('click');
    setCart(prev => prev.map(i => String(i.id)===String(id) ? (i.qty+delta>0?{...i,qty:i.qty+delta}:null) : i).filter(Boolean));
  };

  const startCheckout = (paymentKey) => {
    if (!cart.length) return;
    if (!storeStatus.isOpen) { setNotificationModal({ title:'🚫 مغلق', message:'المتجر مغلق حالياً.' }); return; }
    playSound('click');
    setPendingPaymentMethod(paymentKey);
    setSelectedLocation('');
    setLocationModalOpen(true);
  };

  const confirmOrderWithLocation = async () => {
    if (!selectedLocation) { setNotificationModal({ title:'⚠️', message:'اختر موقعك أولاً.' }); return; }
    if (!dbInstance || !pendingPaymentMethod) return;
    playSound('cash');
    const items = cart.map(i => ({ id:i.id, name:i.name, price:i.price, qty:i.qty, desc:i.desc||'', emoji:i.emoji||'🛒', category:i.category||'', imageUrl:i.imageUrl||'' }));
    const isDebt = pendingPaymentMethod === 'دين 📒';
    const orderData = {
      buyer: currentChatUser, items, totalAmount: cartTotal,
      status: ORDER_STATUSES[0].key, location: selectedLocation,
      paymentMethod: pendingPaymentMethod,
      orderTime: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}),
    };
    try {
      const orderId = await addOrderDoc(orderData);
      if (isDebt) {
        const newDebts = { ...debtsMap };
        newDebts[currentChatUser] = (newDebts[currentChatUser]||0) + cartTotal;
        await updateStoreDataDoc('debts', newDebts);
        await addBotChatDoc({
          sender:'الدعم', text:`📝 طلب بالدين ${cartTotal.toFixed(2)} ر.س على (${currentChatUser}) - ${selectedLocation}.`,
          timeString: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})
        });
      }
      const list = items.map(i => `• ${i.name} × ${i.qty} (${(i.price*i.qty).toFixed(2)} ر.س)`).join('\n');
      const msg = `🛒 *طلب جديد - بقالة أم محمد*\n\n👤 *صاحب الطلب:* ${currentChatUser}\n📍 *الموقع:* ${selectedLocation}\n💳 *طريقة الدفع:* ${pendingPaymentMethod}\n⏰ *الوقت:* ${orderData.orderTime}\n\n📦 *المنتجات:*\n${list}\n\n💰 *الإجمالي:* ${cartTotal.toFixed(2)} ر.س`;
      window.open(`https://wa.me/${MOHAMMED_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
      setCart([]); setLocationModalOpen(false);
      setPendingPaymentMethod(null); setSelectedLocation('');
      setRatingModal({ orderId, rating: 0, comment: '' });
    } catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const submitRating = async () => {
    if (!ratingModal) return;
    playSound('cash');
    try {
      if (ratingModal.rating > 0) {
        await updateOrderDoc(ratingModal.orderId, {
          rating: ratingModal.rating, ratingComment: ratingModal.comment || '', ratedAt: new Date().toISOString(),
        });
      }
    } catch (err) { console.warn('Rating save error:', err.message); }
    closeRatingAndNavigate();
  };
  const closeRatingAndNavigate = () => { setRatingModal(null); setActiveTab('orders'); };

  const handleUpdateOrderStatus = async (docId, newStatus) => {
    playSound('cash');
    try { await updateOrderDoc(docId, { status: newStatus }); }
    catch (err) { setNotificationModal({ title:'❌ فشل', message: err.message }); }
  };

  const tsToTime = (ts) => {
    if (!ts) return '';
    if (ts.seconds) return new Date(ts.seconds*1000).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
    return '';
  };
  const statusColor = cloudStatus==='online' ? 'bg-emerald-400' : cloudStatus==='connecting' ? 'bg-amber-400 animate-pulse' : 'bg-red-400';

  /* ==================================================== UI ==================================================== */
  return (
    <div className="min-h-screen flex flex-col justify-between bg-slate-100">

      <style>{`
        .header-gradient { background: linear-gradient(to right, ${siteTheme.headerFrom}, ${siteTheme.headerVia}, ${siteTheme.headerTo}) !important; }
        .btn-brand { background-color: ${siteTheme.primary} !important; color: white !important; }
        .btn-brand:hover:not(:disabled) { background-color: ${siteTheme.primaryHover} !important; }
        .btn-brand:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed !important; }
        .btn-din { background-color: #f59e0b !important; color: #0f172a !important; }
        .btn-din:hover:not(:disabled) { background-color: #d97706 !important; }
        .btn-din:disabled { background-color: #cbd5e1 !important; color: #64748b !important; }
        .btn-bank { background-color: #2563eb !important; color: white !important; }
        .btn-bank:hover:not(:disabled) { background-color: #1d4ed8 !important; }
        .btn-bank:disabled { background-color: #cbd5e1 !important; color: #64748b !important; }
        .tab-active { background-color: white !important; color: ${siteTheme.text} !important; }
        .text-brand { color: ${siteTheme.primary} !important; }
        .text-brand-dark { color: ${siteTheme.text} !important; }
        .bg-brand { background-color: ${siteTheme.primary} !important; color: white !important; }
        .bg-brand-light { background-color: ${siteTheme.light} !important; color: ${siteTheme.text} !important; }
        .border-brand { border-color: ${siteTheme.primary} !important; }
        .status-open { background: linear-gradient(to left, ${siteTheme.headerTo}, ${siteTheme.headerFrom}) !important; color: white !important; }
        .chat-mine { background-color: ${siteTheme.primary} !important; color: white !important; }
        .logo-icon { color: ${siteTheme.primary} !important; }
      `}</style>

      <header className="header-gradient text-white shadow-lg sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="bg-white p-2 rounded-2xl font-black text-2xl flex items-center justify-center w-12 h-12 overflow-hidden logo-icon">
              {storeLogo.dataUrl ? (<img src={storeLogo.dataUrl} alt="logo" className="w-full h-full object-contain" />) : (<span>{storeLogo.emoji || '🛒'}</span>)}
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-xl md:text-2xl font-black">بقالة أم محمد</h1>
                {/* ✅ رقم الإصدار - يتحدث مع كل ملف جديد */}
                <span className="bg-white/20 text-white text-xs px-2 py-0.5 rounded-full font-bold">v{APP_VERSION}</span>
              </div>
              <p className="text-xs text-white/90 flex items-center gap-1.5 mt-0.5">
                <span className={`inline-block w-2 h-2 rounded-full ${statusColor}`}></span>
                {cloudMessage}
                {cloudStatus !== 'online' && (
                  <button onClick={()=>window.location.reload()} className="ml-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black text-[10px] px-2 py-0.5 rounded-lg">🔄</button>
                )}
              </p>
            </div>
          </div>

          <div className="flex items-center gap-2 bg-black/20 backdrop-blur-sm border border-white/20 px-3.5 py-1.5 rounded-2xl">
            <span className="text-xs font-black text-amber-300">👤 أنت:</span>
            <select value={currentChatUser} onChange={e=>{ playSound('click'); const u=e.target.value; if(u==='الدعم'){ setPinInput(''); setPinError(''); setIdentityModalOpen(false); setSupportPinModalOpen(true); } else setCurrentChatUser(u); }}
              className="bg-white/20 text-white font-extrabold text-xs md:text-sm px-3 py-1 rounded-xl border border-white/30 focus:outline-none cursor-pointer">
              {ALL_CHAT_USERS.map(u => <option key={u} value={u} className="text-slate-900">{u === 'الدعم' ? '🔒 الدعم' : u}</option>)}
            </select>
          </div>

          <nav className="flex items-center gap-1 bg-black/20 p-1 rounded-2xl overflow-x-auto w-full md:w-auto">
            {[['products','🏪 المنتجات'],['ledger','📒 الديون'],['chat','💬 الدردشة'],['orders','📦 الطلبات'],['admin','⚙️ الإدارة 🔒']].map(([k,label]) => (
              <button key={k} onClick={()=>{ playSound('click'); if(k==='admin' && !isAdminAuthenticated){ setPinInput(''); setPinError(''); setAdminPinModalOpen(true); } else setActiveTab(k); }}
                className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap relative ${activeTab===k ? 'tab-active shadow-sm' : 'text-white/85 hover:bg-white/10'}`}>
                {label}
                {k==='ledger' && totalFamilyDebt>0 && <span className="bg-amber-500 text-slate-900 text-[10px] font-extrabold px-1.5 rounded-full mr-1">{totalFamilyDebt.toFixed(0)}</span>}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

        {/* ============ المنتجات ============ */}
        {activeTab === 'products' && (
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-4">
              <div className={`rounded-3xl p-5 shadow-md border-2 flex flex-wrap items-center justify-between gap-3 ${storeStatus.isOpen ? 'status-open border-emerald-500' : 'bg-gradient-to-l from-red-800 to-red-950 border-red-500 text-white'}`}>
                <div>
                  <span className="text-[11px] bg-white/20 text-white font-extrabold px-2 py-0.5 rounded-full">حالة المتجر</span>
                  <h2 className="text-2xl font-black mt-2 flex items-center gap-2">
                    <span className="text-3xl">{storeStatus.isOpen ? '🟢' : '🔴'}</span>
                    {storeStatus.isOpen ? 'المتجر مفتوح الآن' : 'المتجر مغلق حالياً'}
                  </h2>
                  <p className="text-xs text-white/80 mt-1">{storeStatus.isOpen ? 'يمكنك الطلب الآن ويوصلك محمد 🚀' : 'الطلبات معطلة مؤقتاً'}</p>
                </div>
              </div>

              {storeStatus.isOpen && (banner.title || banner.kicker || banner.message) && (
                <div className="rounded-3xl p-5 shadow-sm" style={{ background:`linear-gradient(to left, ${currentBannerTheme.bgFrom}, ${currentBannerTheme.bgTo})`, color: currentBannerTheme.text }}>
                  {banner.kicker && <span className="text-[11px] bg-black/25 text-white font-extrabold px-2 py-0.5 rounded-full">{banner.kicker}</span>}
                  {banner.title && <h2 className="text-base md:text-lg font-black mt-2">{banner.title}</h2>}
                  {banner.message && <p className="text-xs mt-1 leading-relaxed opacity-95">{banner.message}</p>}
                </div>
              )}

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center">
                <div className="relative flex-1 min-w-[180px]">
                  <input type="text" placeholder="ابحث..." value={productSearch} onChange={e=>setProductSearch(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl pr-10 pl-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300" />
                  <span className="absolute right-3 top-2.5 text-slate-400">🔍</span>
                </div>
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                  <button onClick={()=>setSelectedCategory('الكل')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${selectedCategory==='الكل'?'btn-brand':'bg-slate-100 text-slate-600'}`}>الكل</button>
                  {allCategories.map(c => (
                    <button key={c.id} onClick={()=>setSelectedCategory(c.id)} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${selectedCategory===c.id?'btn-brand':'bg-slate-100 text-slate-600'}`}>{c.name}</button>
                  ))}
                </div>
              </div>

              {filteredProducts.length === 0 ? (
                <div className="bg-white rounded-3xl p-12 text-center text-slate-400 border border-slate-200"><div className="text-5xl opacity-40 mb-2">📦</div><p className="font-bold">لا توجد منتجات</p></div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {filteredProducts.map(p => {
                    const imgSrc = imageMap[String(p.id)] || p.imageUrl || '';
                    return (
                      <div key={p.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col group">
                        <div className="relative w-full h-48 bg-white rounded-2xl overflow-hidden mb-3 border border-slate-100 flex items-center justify-center">

              <div><label className="block text-xs font-bold mb-1">العنوان الفرعي:</label><input type="text" name="kicker" defaultValue={bannerModal.kicker || ''} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" /></div>
              <div><label className="block text-xs font-bold mb-1">العنوان:</label><input type="text" name="title" defaultValue={bannerModal.title || ''} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" /></div>
              <div><label className="block text-xs font-bold mb-1">الرسالة:</label><textarea name="message" defaultValue={bannerModal.message || ''} rows="3" className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-semibold" /></div>
              <div>
                <label className="block text-xs font-bold mb-2">🎨 اللون:</label>
                <div className="grid grid-cols-4 gap-2">
                  {BANNER_THEMES.map(theme => (
                    <button key={theme.id} type="button" onClick={()=>setBannerModal({ ...bannerModal, themeId: theme.id })}
                      className={`relative h-14 rounded-xl transition border-2 ${bannerModal.themeId===theme.id ? 'border-slate-900 scale-105 shadow-md' : 'border-transparent'}`}
                      style={{ background:`linear-gradient(to bottom right, ${theme.bgFrom}, ${theme.bgTo})`, color: theme.text }}>
                      <span className="text-[9px] font-black">{theme.label}</span>
                      {bannerModal.themeId===theme.id && <span className="absolute top-0.5 right-0.5 text-white bg-slate-900 rounded-full w-4 h-4 flex items-center justify-center text-[10px]">✓</span>}
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
                <button type="button" onClick={()=>setBannerModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {productModal && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3"><h3 className="font-black">{productModal.mode==='add'?'➕ إضافة منتج':'✏️ تعديل'}</h3><button onClick={()=>setProductModal(null)}>✕</button></div>
            <form onSubmit={handleSaveProduct} className="space-y-3">
              <div><label className="block text-xs font-bold mb-1">الاسم:</label><input type="text" name="name" defaultValue={productModal.data?.name||''} required className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" /></div>
              <div className="grid grid-cols-2 gap-2">
                <div><label className="block text-xs font-bold mb-1">القسم:</label>
                  <select name="category" defaultValue={productModal.data?.category || allCategories[0]?.id || ''} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold">
                    {allCategories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    <option value="">— بدون —</option>
                  </select>
                </div>
                <div><label className="block text-xs font-bold mb-1">السعر:</label><input type="number" step="0.5" name="price" defaultValue={productModal.data?.price||0} required className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" /></div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div><label className="block text-xs font-bold mb-1">أيقونة:</label><input type="text" name="emoji" defaultValue={productModal.data?.emoji||'🛒'} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-center" maxLength={2} /></div>
                <div><label className="block text-xs font-bold mb-1">وصف:</label><input type="text" name="desc" defaultValue={productModal.data?.desc||''} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold" /></div>
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">📷 الصورة:</label>
                <ImageUploader value={productModal.pendingImage || (productModal.data?.id ? imageMap[String(productModal.data.id)] : '') || ''} onChange={(val)=>setProductModal({ ...productModal, pendingImage: val })} label="اختر صورة المنتج" maxSizeKB={700} />
              </div>
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">حفظ 💾</button>
                <button type="button" onClick={()=>setProductModal(null)} className="bg-slate-100 font-bold px-4 py-2.5 rounded-xl text-xs">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {locationModalOpen && (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div><h3 className="font-black">📍 وين أنت؟</h3><p className="text-xs text-slate-500 mt-0.5">اختر موقعك</p></div>
              <button onClick={()=>{ setLocationModalOpen(false); setPendingPaymentMethod(null); setSelectedLocation(''); }}>✕</button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              {LOCATIONS.map(loc => (
                <button key={loc} onClick={()=>{ playSound('click'); setSelectedLocation(loc); }}
                  className={`p-3 rounded-xl text-xs font-bold transition border-2 ${selectedLocation===loc ? 'btn-brand border-transparent shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}>
                  {selectedLocation===loc ? '✓ ' : ''}{loc}
                </button>
              ))}
            </div>
            <div className="bg-slate-50 p-3 rounded-xl text-xs space-y-1 border border-slate-200">
              <div className="flex justify-between"><span>الطلب باسم:</span><strong className="text-brand">{currentChatUser}</strong></div>
              <div className="flex justify-between"><span>طريقة الدفع:</span><strong>{pendingPaymentMethod}</strong></div>
              <div className="flex justify-between"><span>الإجمالي:</span><strong className="text-brand">{cartTotal.toFixed(2)} ر.س</strong></div>
              <div className="flex justify-between"><span>الموقع:</span><strong className={selectedLocation?'text-purple-700':'text-slate-400'}>{selectedLocation || 'لم يُحدد'}</strong></div>
            </div>
            <div className="flex gap-2">
              <button onClick={confirmOrderWithLocation} disabled={!selectedLocation} className="btn-brand flex-1 font-extrabold py-3 rounded-xl text-xs">✅ تأكيد الطلب وإرسال واتساب</button>
              <button onClick={()=>{ setLocationModalOpen(false); setPendingPaymentMethod(null); setSelectedLocation(''); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-3 rounded-xl text-xs">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {adminPinModalOpen && (
        <div className="fixed inset-0 bg-slate-950/70 z-[110] flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4">
            <div className="text-4xl">⚙️</div>
            <h3 className="font-black">لوحة الإدارة 🔒</h3>
            <form onSubmit={(e)=>{ e.preventDefault(); if (pinInput==='3421'){ playSound('cash'); setIsAdminAuthenticated(true); setAdminPinModalOpen(false); setActiveTab('admin'); setPinInput(''); setPinError(''); } else { playSound('click'); setPinError('كلمة المرور غير صحيحة!'); } }} className="space-y-3">
              <input type="password" value={pinInput} onChange={e=>{setPinInput(e.target.value);setPinError('');}} autoFocus className="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-center font-black" placeholder="الرمز" />
              {pinError && <p className="text-xs text-red-600 bg-red-50 p-2 rounded-lg">{pinError}</p>}
              <div className="flex gap-2">
                <button type="submit" className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">فتح</button>
                <button type="button" onClick={()=>setAdminPinModalOpen(false)} className="bg-slate-100 px-4 py-2.5 rounded-xl text-xs font-bold">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {payModalMember && (
        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4">
            <div className="flex justify-between border-b pb-3"><h3 className="font-black">تسديد: {payModalMember.name}</h3><button onClick={()=>setPayModalMember(null)}>✕</button></div>
            <div className="bg-slate-50 p-3 rounded-2xl text-xs"><p>الدين الحالي:</p><p className="text-lg font-black text-amber-600">{payModalMember.totalDebt.toFixed(2)} ر.س</p></div>
            <input type="number" value={payAmountInput} onChange={e=>setPayAmountInput(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 py-2 text-sm font-bold" />
            <div className="flex gap-2">
              <button onClick={handleSettleDebt} className="btn-brand flex-1 font-extrabold py-2.5 rounded-xl text-xs">تأكيد 💵</button>
              <button onClick={()=>setPayModalMember(null)} className="bg-slate-100 px-4 py-2.5 rounded-xl text-xs font-bold">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {notificationModal && (
        <div className="fixed inset-0 bg-slate-900/60 z-[120] flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4">
            <div className="text-4xl">✅</div>
            <h3 className="font-black">{notificationModal.title}</h3>
            <p className="text-xs text-slate-600">{notificationModal.message}</p>
            <button onClick={()=>setNotificationModal(null)} className="btn-brand w-full font-black py-2.5 rounded-xl text-xs">حسناً</button>
          </div>
        </div>
      )}

      <footer className="bg-slate-900 text-slate-400 text-center py-4 text-xs mt-6">
        <div className="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2">
          <span>بقالة أم محمد © 2026</span>
          <span className="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full text-[11px] font-bold">v{APP_VERSION}</span>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GroceryApp />);
</script>
</body>
</html>
