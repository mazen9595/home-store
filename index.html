<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالة أم محمد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --primary-dark: #EE5253;
            --secondary: #48DBFB;
            --accent: #FF9F43;
            --bg-color: #F7F9FC;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
            --text-muted: #636E72;
            --shadow: 0 10px 25px rgba(0,0,0,0.06);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #E2E8F0;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* حاوية الآيفون */
        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 896px;
            max-height: 100vh;
            background-color: var(--bg-color);
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25), 0 0 0 12px #1A1A1A;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* المحتوى الرئيسي */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .app-content::-webkit-scrollbar {
            display: none;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .store-title h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
        }

        .store-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .cart-btn {
            background: var(--card-bg);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .cart-btn:active {
            transform: scale(0.92);
        }

        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
        }

        /* التصنيفات */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: var(--card-bg);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s;
        }

        .cat-chip.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.3);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .product-card:active {
            transform: scale(0.96);
        }

        .product-img {
            background: #F1F2F6;
            height: 100px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin-bottom: 12px;
        }

        .product-info h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .product-info .price {
            font-size: 14px;
            font-weight: 900;
            color: var(--primary);
        }

        /* النافذة المنبثقة (Modal) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            background: white;
            width: 100%;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 25px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: #F1F2F6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تحكم الكمية */
        .qty-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .qty-btn {
            background: #F1F2F6;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-num {
            font-size: 20px;
            font-weight: 700;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255,107,107,0.3);
        }

        /* سلة الطلبات المعدلة */
        .cart-drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 150;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .cart-drawer.active {
            transform: translateX(0);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F8FAFC;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid #E2E8F0;
            background: white;
        }

        /* اختيار العائلة */
        .family-select {
            margin-bottom: 15px;
        }

        .family-select label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .family-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .family-chip {
            background: #F1F2F6;
            border: 2px solid transparent;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .family-chip.selected {
            background: #FFF0F0;
            border-color: var(--primary);
            color: var(--primary);
        }

        /* حقل رقم جوال محمد */
        .phone-input-group {
            margin-bottom: 15px;
        }
        .phone-input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        .phone-input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }

        .success-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- المحتوى الرئيسي للمتجر -->
        <div class="app-content">
            <header>
                <div class="store-title">
                    <h1>بقالة أم محمد 🛒</h1>
                    <p>أطلب وتوصلك الطلبية للباب!</p>
                </div>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
            </header>

            <!-- التصنيفات -->
            <div class="categories">
                <button class="cat-chip active" onclick="filterCat('all')">الكل ✨</button>
                <button class="cat-chip" onclick="filterCat('drinks')">مشروبات 🥤</button>
                <button class="cat-chip" onclick="filterCat('snacks')">تسالي وشيبسات 🍿</button>
                <button class="cat-chip" onclick="filterCat('sweets')">حلى وشوكليت 🍫</button>
            </div>

            <!-- المنتجات -->
            <div class="products-grid" id="productsGrid">
                <!-- تعبئة تلقائية بالسكربت -->
            </div>
        </div>

        <!-- نافذة تفاصيل المنتج -->
        <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
            <div class="modal-sheet" onclick="event.stopPropagation()">
                <div class="sheet-header">
                    <h2 id="modalTitle">اسم المنتج</h2>
                    <button class="close-btn" onclick="closeModalBtn()">✕</button>
                </div>
                <div style="text-align: center; font-size: 70px; margin: 15px 0;" id="modalEmoji">🥤</div>
                <p id="modalDesc" style="color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 15px;"></p>
                <div style="text-align: center; font-size: 20px; font-weight: 900; color: var(--primary);" id="modalPrice">0 ريال</div>

                <div class="qty-control">
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <span class="qty-num" id="modalQty">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>

                <div class="action-btns">
                    <button class="btn-primary" onclick="addToCartFromModal()">إضافة للسلة 🛍️</button>
                </div>
            </div>
        </div>

        <!-- سلة الطلبات -->
        <div class="cart-drawer" id="cartDrawer">
            <div class="cart-header">
                <h2>سلة الطلبات 🛒</h2>
                <button class="close-btn" onclick="toggleCart()">✕</button>
            </div>
            
            <div class="cart-body" id="cartItemsList">
                <!-- المنتجات المضافة تظهر هنا -->
            </div>

            <div class="cart-footer">
                <div class="family-select">
                    <label>مين اللي طالب؟ (اختر اسمك):</label>
                    <div class="family-chips" id="familyChipsContainer">
                        <div class="family-chip" onclick="selectFamilyMember('بابا')">بابا</div>
                        <div class="family-chip" onclick="selectFamilyMember('ماما')">ماما</div>
                        <div class="family-chip" onclick="selectFamilyMember('مازن')">مازن</div>
                        <div class="family-chip" onclick="selectFamilyMember('ريتال')">ريتال</div>
                        <div class="family-chip" onclick="selectFamilyMember('مهاب')">مهاب</div>
                    </div>
                </div>

                <div class="phone-input-group">
                    <label>رقم جوال محمد (لاستلام الطلب):</label>
                    <input type="tel" id="mohammadPhone" placeholder="مثال: 9665xxxxxxxx" value="9665">
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 700; font-size: 16px;">
                    <span>المجموع الإجمالي:</span>
                    <span id="cartTotal" style="color: var(--primary);">0 ريال</span>
                </div>

                <button class="btn-primary" style="width: 100%;" onclick="checkoutWhatsApp()">إرسال عبر الواتساب لمحمد 🚀</button>
            </div>
        </div>

    </div>

    <script>
        // بيانات المنتجات
        const products = [
            { id: 1, name: 'بيبسي بارد', price: 3, category: 'drinks', emoji: '🥤', desc: 'بارد ومنعش ولذييذ' },
            { id: 2, name: 'عصير برتقال', price: 4, category: 'drinks', emoji: '🧃', desc: 'طبيعي وطازج' },
            { id: 3, name: 'شيبس ليز', price: 3, category: 'snacks', emoji: '🥔', desc: 'بالملح والخل المقرمش' },
            { id: 4, name: 'شيبس دوريتوس', price: 4, category: 'snacks', emoji: '🧀', desc: 'بالجبنة الحارة الشهية' },
            { id: 5, name: 'شوكليت جالاكسي', price: 5, category: 'sweets', emoji: '🍫', desc: 'ناعمة وذائبة بالفم' },
            { id: 6, name: 'بسكويت أولكر', price: 2, category: 'sweets', emoji: '🍪', desc: 'مع الشاي يضبط المزاج' }
        ];

        let cart = [];
        let currentProduct = null;
        let selectedQty = 1;
        let selectedBuyer = '';

        // عرض المنتجات
        function renderProducts(filter = 'all') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openProduct(${p.id})">
                        <div class="product-img">${p.emoji}</div>
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price} ريال</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCat(cat) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(cat);
        }

        // فتح تفاصيل المنتج
        function openProduct(id) {
            currentProduct = products.find(p => p.id === id);
            selectedQty = 1;
            document.getElementById('modalTitle').innerText = currentProduct.name;
            document.getElementById('modalEmoji').innerText = currentProduct.emoji;
            document.getElementById('modalDesc').innerText = currentProduct.desc;
            document.getElementById('modalPrice').innerText = currentProduct.price + ' ريال';
            document.getElementById('modalQty').innerText = selectedQty;
            document.getElementById('productModal').classList.add('active');
        }

        function closeModal(e) {
            if(e.target.id === 'productModal') closeModalBtn();
        }

        function closeModalBtn() {
            document.getElementById('productModal').classList.remove('active');
        }

        function changeQty(amt) {
            selectedQty += amt;
            if(selectedQty < 1) selectedQty = 1;
            document.getElementById('modalQty').innerText = selectedQty;
        }

        // إضافة للسلة
        function addToCartFromModal() {
            const existing = cart.find(item => item.id === currentProduct.id);
            if(existing) {
                existing.qty += selectedQty;
            } else {
                cart.push({ ...currentProduct, qty: selectedQty });
            }
            updateCartUI();
            closeModalBtn();
            toggleCart();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = count;

            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            if(cart.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 50px;">السلة فارغة حالياً 🛒</p>`;
                document.getElementById('cartTotal').innerText = '0 ريال';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.emoji} ${item.name}</strong>
                            <div style="font-size: 12px; color: var(--text-muted);">${item.price} ريال × ${item.qty}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-weight: 700; color: var(--primary);">${item.price * item.qty} ريال</span>
                            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; cursor:pointer; font-size:16px;">🗑️</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cartTotal').innerText = total + ' ريال';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('active');
        }

        function selectFamilyMember(name) {
            selectedBuyer = name;
            document.querySelectorAll('.family-chip').forEach(c => c.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        // إرسال الطلب عبر الواتساب مباشرة
        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert('السلة فارغة يا غالي!');
                return;
            }
            if(!selectedBuyer) {
                alert('الرجاء اختيار اسم الشخص طالب الطلبية أولاً!');
                return;
            }

            const phoneInput = document.getElementById('mohammadPhone').value.trim();
            if(!phoneInput || phoneInput.length < 9) {
                alert('الرجاء التأكد من كتابة رقم جوال محمد بشكل صحيح!');
                return;
            }

            let orderText = `🚨 *طلب جديد في بقالة أم محمد!*\n`;
            orderText += `👤 الطالب: *${selectedBuyer}*\n\n`;
            orderText += `📋 *تفاصيل الطلب:*\n`;
            
            let total = 0;
            cart.forEach(item => {
                orderText += `• ${item.name} (عدد: ${item.qty}) = ${item.price * item.qty} ريال\n`;
                total += item.price * item.qty;
            });
            orderText += `\n💰 *المجموع الكلي: ${total} ريال*`;

            // فتح الواتساب برابط مباشر
            const encodedMessage = encodeURIComponent(orderText);
            const whatsappUrl = `https://wa.me/${phoneInput}?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
        }

        // التشغيل الأول
        renderProducts();
    </script>
</body>
</html>
